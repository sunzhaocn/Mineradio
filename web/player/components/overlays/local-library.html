<div id="web-library-mask" class="web-library-mask" hidden>
  <section class="web-library" role="dialog" aria-modal="true" aria-labelledby="web-library-title" tabindex="-1">
    <header class="web-library-head">
      <div><span class="web-library-kicker">MY MUSIC · 我的音乐</span><h2 id="web-library-title">我的音乐库</h2></div>
      <div class="web-library-emblem" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button type="button" id="web-library-close" class="web-library-icon" aria-label="关闭音乐库">×</button>
    </header>
    <div class="web-library-toolbar">
      <div class="web-library-tabs" aria-label="平台筛选" id="web-library-tabs"></div>
      <div class="web-library-actions"><button type="button" id="web-library-manage" aria-pressed="false">隐藏管理</button><button type="button" id="web-library-refresh">刷新音乐库</button></div>
    </div>
    <div id="web-library-status" class="web-library-status" role="status" aria-live="polite"></div>
    <div id="web-library-content" class="web-library-content"></div>
    <footer class="web-library-foot">同步只添加新歌，取消不会撤回已成功的收藏。</footer>
  </section>
</div>
