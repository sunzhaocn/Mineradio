<div id="cookie-export-prompt" class="cookie-export-prompt" aria-live="polite">
      <div class="cookie-export-card">
        <div class="cookie-export-kicker">LOGIN COOKIE</div>
        <div id="cookie-export-title" class="cookie-export-title">是否导出登录 cookie 到桌面？</div>
        <div id="cookie-export-desc" class="cookie-export-desc">导出的文件会用于备份当前平台登录态。</div>
        <div class="cookie-export-actions">
          <button type="button" onclick="dismissCookieExportPrompt(false)">暂不导出</button>
          <button class="primary" type="button" onclick="confirmCookieExportPrompt()">导出到桌面</button>
        </div>
      </div>
    </div>
