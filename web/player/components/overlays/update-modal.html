<div id="update-modal" class="modal-mask">
      <div class="modal update-modal">
        <div class="update-panel-inner">
          <div class="update-panel-head">
            <div>
              <div class="update-kicker">MINERADIO</div>
              <div id="update-modal-title" class="update-title">New release</div>
              <div id="update-modal-version" class="update-version">v2.2.0</div>
            </div>
          </div>
          <div class="update-hero">
            <div id="update-hero-main" class="update-hero-main">请以本次发布公告中的最新网盘链接为准。</div>
            <div id="update-hero-sub" class="update-hero-sub"></div>
          </div>
          <div id="update-list" class="update-list"></div>
          <div id="update-download-sources" class="update-download-sources" hidden
            aria-label="下载线路"></div>
          <div class="update-actions">
            <button id="update-primary-btn" class="update-primary-btn" type="button"
              onclick="startUpdatePreviewDownload()">
              <span id="update-btn-fill" class="update-btn-fill"></span>
              <span id="update-btn-label" class="update-btn-label">查看更新页面</span>
            </button>
            <button class="update-secondary-btn" type="button" onclick="closeUpdatePanel()">取消</button>
          </div>
          <div id="update-footnote" class="update-footnote">将在浏览器打开下载页面，软件不会在本地下载或应用补丁。</div>
        </div>
      </div>
    </div>
