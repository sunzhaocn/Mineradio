<div id="login-modal" class="modal-mask">
      <div class="modal dual-login-modal">
        <div class="login-panel-head">
          <div><b>登录接入</b><small>拖接口端口到 MR</small></div>
          <button id="login-reset-all-btn" class="login-reset-all-btn" type="button"
            onclick="logoutAllAccountsAndResetEasterEgg()" title="清除所有平台登录并重新锁定彩蛋">退出登录</button>
          <button class="login-panel-close" type="button" onclick="closeLoginModal()">×</button>
        </div>
        <section id="login-easter-egg-gate" class="login-easter-egg-gate" aria-hidden="true">
          <button id="login-easter-eye-trigger" class="login-easter-eye-trigger" type="button"
            onclick="handleLoginEasterEggTap()" aria-label="轻触大小眼">
            <span class="login-easter-eyes" aria-hidden="true">
              <i class="login-easter-eye login-easter-eye-big"></i>
              <i class="login-easter-eye login-easter-eye-small"></i>
            </span>
          </button>
          <div id="login-easter-hint" class="login-easter-hint" aria-live="polite"></div>
          <div id="login-easter-egg-wish" class="login-easter-egg-wish">
            <h1>心愿是</h1>
            <div class="login-easter-input-shell">
              <div id="login-easter-egg-cells" class="login-easter-cells" aria-hidden="true">
                <span class="login-easter-cell"></span>
                <span class="login-easter-cell"></span>
                <span class="login-easter-cell"></span>
                <span class="login-easter-cell"></span>
              </div>
              <input id="login-easter-egg-input" class="login-easter-input" type="text"
                inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                aria-label="输入四个字的愿望">
            </div>
            <div id="login-easter-status" class="login-easter-status" aria-live="polite"></div>
          </div>
        </section>
        <div id="login-node-graph" class="login-node-graph" data-provider="netease">
          <svg id="login-workflow-svg" class="workflow-link-layer login-link-layer" aria-hidden="true"></svg>
          <div class="login-platform-tabs login-node-providers" id="login-platform-tabs">
            <button id="login-provider-netease" class="netease active workflow-node" type="button" data-login-provider="netease"
              onclick="selectLoginProviderNode('netease')"><span class="provider-logo">NE</span><b>网易云</b><small>官方扫码 / Cookie</small><span class="flow-port out" data-login-provider-output="netease" title="拖到 MR 接入口"></span></button>
            <button id="login-provider-qq" class="qq workflow-node" type="button" data-login-provider="qq" onclick="selectLoginProviderNode('qq')"><span
                class="provider-logo">QQ</span><b>QQ 音乐</b><small>官方扫码 / Cookie</small><span class="flow-port out" data-login-provider-output="qq" title="拖到 MR 接入口"></span></button>
            <button id="login-provider-kugou" class="kugou workflow-node" type="button" data-login-provider="kugou" onclick="selectLoginProviderNode('kugou')"><span
                class="provider-logo">KG</span><b>酷狗音乐</b><small>官方窗口 / Cookie</small><span class="flow-port out" data-login-provider-output="kugou" title="拖到 MR 接入口"></span></button>
            <button id="login-provider-qishui" class="qishui workflow-node" type="button" data-login-provider="qishui" onclick="selectLoginProviderNode('qishui')"><span
                class="provider-logo">QS</span><b>汽水音乐</b><small>官方扫码 / 抖音确认</small><span class="flow-port out" data-login-provider-output="qishui" title="拖到 MR 接入口"></span></button>
          </div>
          <div class="login-node-hub workflow-node" data-login-node="mr">
            <span class="flow-port in" data-login-mr-target="mr" title="MR 接入口"></span>
            <span class="login-node-orb">MR</span>
            <div class="login-node-copy"><b>MR</b><small>等待接入</small></div>
            <div class="login-mode-nodes">
              <button id="login-mode-official" class="login-mode-node active workflow-node" type="button" data-login-mode="official"
                onclick="selectLoginMode('official')"><span class="provider-logo">QR</span><b>扫码</b><small>官方窗口</small></button>
              <button id="login-mode-cookie" class="login-mode-node workflow-node" type="button" data-login-mode="cookie"
                onclick="selectLoginMode('cookie')"><span class="provider-logo">CK</span><b>Cookie</b><small>保存会话</small></button>
            </div>
          </div>
        </div>
        <div id="login-auth-drawer" class="login-auth-drawer">
          <div class="login-auth-copy">
            <h2 id="login-modal-title">扫码登录网易云音乐</h2>
            <div id="login-modal-desc" class="desc">使用 <b>网易云音乐 App</b> 扫码，可同步歌单、红心与播客。</div>
            <div id="qr-status">拖动接口到 MR 接入口后开始登录。</div>
          </div>
          <div class="login-auth-body">
            <div id="qr-shell" class="qr-shell">
              <img id="qr-img" src="" alt="">
              <button id="qq-web-login-card" class="qq-login-mark" type="button"
                onclick="openProviderWebLogin()"><b>QQ</b><span>打开官方扫码窗口</span></button>
            </div>
            <div id="qq-cookie-panel" class="qq-cookie-panel">
              <textarea id="qq-cookie-input" class="qq-cookie-input" spellcheck="false" autocomplete="off"
                placeholder="uin=...; qqmusic_key=...; qm_keyst=..."></textarea>
              <div class="qq-cookie-actions">
                <div class="qq-cookie-note">从 y.qq.com 的登录会话导入。</div>
                <button id="qq-cookie-save-btn" class="modal-btn primary" type="button"
                  onclick="submitQQCookieLogin()">保存</button>
              </div>
            </div>
          </div>
          <div class="btn-row login-auth-actions">
            <button class="modal-btn" onclick="skipLoginAndFocusSearch()">先搜索一首歌</button>
            <button id="qq-cookie-toggle-btn" class="modal-btn" type="button"
              onclick="toggleQQCookiePanel()">手动导入</button>
            <button id="refresh-qr-btn" class="modal-btn primary" onclick="startSelectedLoginConnection()">开始登录</button>
          </div>
        </div>
      </div>
    </div>
