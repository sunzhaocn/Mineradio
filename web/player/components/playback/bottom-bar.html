<div id="bottom-bar">
      <div id="mini-queue-popover" class="mini-queue-popover" onclick="event.stopPropagation()">
        <div class="mini-queue-head">
          <div>
            <div class="mini-queue-title">当前队列</div>
            <div id="mini-queue-count" class="mini-queue-count">0 首</div>
          </div>
          <button class="fx-mini-btn ghost" onclick="closeMiniQueue()" title="关闭"
            style="height:26px;padding:0 9px;font-size:13px">×</button>
        </div>
        <div id="mini-queue-list" class="mini-queue-list"></div>
      </div>
      <div id="progress-bar">
        <div id="progress-fill"></div>
        <div id="progress-thumb" aria-hidden="true"></div>
      </div>
      <div id="controls">
        <div class="control-cluster actions">
          <div class="control-track">
            <div id="control-cover" class="control-cover cover-empty" role="button" tabindex="0" title="专辑详情"
              aria-label="专辑详情" onclick="openTrackDetailModal('album')"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTrackDetailModal('album')}"></div>
            <div class="control-meta">
              <div id="control-title" class="control-title" onclick="openTrackDetailModal('song')" title="歌曲详情">
                <span id="control-title-text" class="control-title-text"></span>
                <span id="control-title-badges" class="control-title-badges"></span>
                <div id="quality-control" class="quality-control control-quality-chip">
                  <button id="quality-btn" class="ctrl-btn quality-pill" title="选择音质"><span
                      id="quality-btn-label">SQ</span></button>
                  <div class="quality-popover" onclick="event.stopPropagation()">
                    <div id="quality-option-list" class="quality-option-list"></div>
                  </div>
                </div>
              </div>
              <div id="control-artist" class="control-artist" onclick="openTrackDetailModal('artist')" title="歌手详情">
              </div>
            </div>
          </div>
          <button id="web-download-btn" class="ctrl-btn" type="button" title="下载当前音源，可选择音质" aria-label="下载当前音源，可选择音质"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></svg></button>
          <button id="heart-btn" class="ctrl-btn" onclick="toggleLikeCurrent()" title="红心喜欢"><svg class="heart-svg"
              viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21.45c-.32 0-.62-.12-.86-.34l-1.23-1.12C5.54 16.03 2.25 13.05 2.25 8.9 2.25 5.48 4.88 2.9 8.28 2.9c1.7 0 3.35.72 4.52 1.96C13.97 3.62 15.62 2.9 17.32 2.9c3.4 0 6.03 2.58 6.03 6 0 4.15-3.29 7.13-7.66 11.09l-1.23 1.12c-.24.22-.54.34-.86.34z" />
            </svg></button>
          <button id="collect-btn" class="ctrl-btn" onclick="openCollectModalForCurrent()" title="收藏到歌单"><svg width="18"
              height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg></button>
        </div>
        <div class="control-cluster transport">
          <button id="play-mode-btn" class="ctrl-btn" type="button" onclick="cyclePlayMode()" title="列表循环 · 点击切换随机播放" aria-label="播放模式：列表循环，点击切换随机播放"><svg id="play-mode-icon"
              width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M17 2l4 4-4 4" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <path d="M7 22l-4-4 4-4" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg></button>
          <button id="prev-btn" class="ctrl-btn" onclick="prevTrack(true)" title="上一首"><svg width="18" height="18"
              fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg></button>
          <button id="play-btn" class="ctrl-btn" onclick="togglePlay()" title="播放/暂停"><svg id="play-icon" width="20"
              height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg></button>
          <button id="next-btn" class="ctrl-btn" onclick="nextTrack(true)" title="下一首"><svg width="18" height="18"
              fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg></button>
          <button id="mini-queue-btn" class="ctrl-btn" onclick="toggleMiniQueue(event)" title="当前队列"><svg width="19"
              height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M8 6h13" />
              <path d="M8 12h13" />
              <path d="M8 18h13" />
              <path d="M3 6h.01" />
              <path d="M3 12h.01" />
              <path d="M3 18h.01" />
            </svg></button>
        </div>
        <div class="control-cluster modes">
          <div id="lyric-timing-control" class="lyric-timing-control">
            <button id="lyrics-toggle-btn" class="ctrl-btn lyrics-toggle-btn" onclick="toggleLyricsPanel()" title="歌词"><span
                class="lyrics-word-icon">词</span></button>
            <div id="lyric-timing-popover" class="lyric-timing-popover" onclick="event.stopPropagation()">
              <div class="lyric-timing-head">
                <span>歌词校准</span>
                <strong id="lyric-timing-value">0.0s</strong>
              </div>
              <div id="lyric-timing-song" class="lyric-timing-song">当前歌曲</div>
              <div class="lyric-timing-actions">
                <button type="button" data-lyric-offset-step="-0.1" title="歌词延后 0.1 秒">-0.1</button>
                <button type="button" data-lyric-offset-reset title="重置当前歌曲歌词校准">0</button>
                <button type="button" data-lyric-offset-step="0.1" title="歌词提前 0.1 秒">+0.1</button>
              </div>
            </div>
          </div>
          <div id="volume-control" class="volume-control">
            <button id="volume-btn" class="ctrl-btn" onclick="toggleVolumePanel(event)" title="音量 / 静音"><svg
                id="volume-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15 9.5a4 4 0 0 1 0 5" />
              </svg></button>
            <div class="volume-popover" onclick="event.stopPropagation()">
              <div class="volume-main-row">
                <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
                <span id="volume-value">100%</span>
              </div>
              <div class="fade-control-row">
                <label for="fade-in-slider">淡入</label>
                <input id="fade-in-slider" type="range" min="0" max="3" step="0.05" value="0.45" aria-label="音乐淡入秒数">
                <span id="fade-in-value">0.45s</span>
              </div>
              <div class="fade-control-row">
                <label for="fade-out-slider">淡出</label>
                <input id="fade-out-slider" type="range" min="0" max="3" step="0.05" value="0.40" aria-label="音乐淡出秒数">
                <span id="fade-out-value">0.40s</span>
              </div>
            </div>
          </div>
          <button id="controls-hide-btn" class="ctrl-btn active" onclick="toggleControlsAutoHide()" title="控制条自动隐藏"><svg
              width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M5 8h14" />
              <path d="M8 12h8" />
              <path d="M10 16h4" />
            </svg></button>
          <button id="immersive-btn" class="ctrl-btn" onclick="toggleImmersiveMode()" title="全沉浸式" aria-label="全沉浸式"
            aria-pressed="false"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9"
              viewBox="0 0 24 24">
              <path d="M4 9V5a1 1 0 0 1 1-1h4" />
              <path d="M15 4h4a1 1 0 0 1 1 1v4" />
              <path d="M20 15v4a1 1 0 0 1-1 1h-4" />
              <path d="M9 20H5a1 1 0 0 1-1-1v-4" />
              <circle cx="12" cy="12" r="2.2" />
            </svg></button>
          <button class="ctrl-btn fullscreen-toggle-btn" onclick="toggleFullscreen()" title="全屏 (F)"><svg width="18"
              height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 7V3h4" />
              <path d="M21 7V3h-4" />
              <path d="M3 17v4h4" />
              <path d="M21 17v4h-4" />
            </svg></button>
          <button id="personal-radio-toggle" class="ctrl-btn" type="button" onclick="window.webPersonalRadio && window.webPersonalRadio.toggle()" title="随心听" aria-label="随心听" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/></svg></button>
          <div id="time-display">0:00 / 0:00</div>
        </div>
      </div>
    </div>
