<div class="fx-fold" id="fx-overlay-fold">
        <div class="fx-fold-head" onclick="document.getElementById('fx-overlay-fold').classList.toggle('open')">
          <span class="fx-fold-title"><strong>叠加效果</strong><small>粒子 / 镜头 / 溢光</small></span><span
            class="arrow">▶</span>
        </div>
        <div class="fx-fold-body">
          <div class="fx-toggle-grid">
            <div class="fx-toggle" id="t-float" onclick="toggleFx('floatLayer')"><span>浮空粒子层</span><span
                class="dot"></span></div>
            <div class="fx-toggle" id="t-cinema" onclick="toggleFx('cinema')"><span>电影镜头</span><span class="dot"></span>
            </div>
            <div class="fx-toggle" id="t-lyricGlow" onclick="toggleFx('lyricGlow')"><span>歌词溢光</span><span
                class="dot"></span></div>
            <div class="fx-toggle" id="t-lyricGlowBeat" onclick="toggleFx('lyricGlowBeat')"><span>鼓点溢光</span><span
                class="dot"></span></div>
            <div class="fx-toggle" id="t-lyricGlowParticles" onclick="toggleFx('lyricGlowParticles')">
              <span>歌词光粒</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-backgroundStarRiver" onclick="toggleFx('backgroundStarRiver')">
              <span>背景星河</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-lyricVerticalFloat" onclick="toggleFx('lyricVerticalFloat')">
              <span>歌词上下浮动</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-lyricPauseHold" onclick="toggleFx('lyricPauseHold')">
              <span>暂停保留歌词</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-lyricCameraLock" onclick="toggleFx('lyricCameraLock')"><span>歌词镜头绑定</span><span
                class="dot"></span></div>
            <div class="fx-toggle" id="t-bloom" onclick="toggleFx('bloom')"><span>粒子溢光</span><span class="dot"></span>
            </div>
            <div class="fx-toggle" id="t-edge" onclick="toggleFx('edge')"><span>轮廓高亮</span><span class="dot"></span>
            </div>
            <div class="fx-toggle" id="t-desktopLyrics" onclick="toggleFx('desktopLyrics')" title="全屏幕置顶歌词">
              <span>桌面歌词</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-desktopLyricsClickThrough" onclick="toggleFx('desktopLyricsClickThrough')"
              title="锁定后防误触；鼠标移到桌面歌词上按中键可锁定/解锁"><span>桌面歌词锁定</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-desktopLyricsCinema" onclick="toggleFx('desktopLyricsCinema')"
              title="桌面歌词绑定鼓点电影震动，基础漂浮始终保留"><span>桌面歌词电影震动</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-desktopLyricsHighlight" onclick="toggleFx('desktopLyricsHighlight')"
              title="桌面歌词按播放进度高亮"><span>桌面歌词高亮跟随</span><span class="dot"></span></div>
            <div class="fx-toggle" id="t-wallpaperMode" onclick="toggleFx('wallpaperMode')"
              title="把当前完整 Mineradio 放到 Windows 桌面；右上控制器可显示、隐藏桌面图标，Esc 退出">
              <span>完整桌面模式<em class="fx-dev-badge">试验</em></span><span class="dot"></span></div>
          </div>
          <div class="fx-section-label">桌面 / 壁纸</div>
          <div class="fx-slider"><label>桌面歌词大小</label><input id="fx-desktoplyricssize" type="range" min="0.72"
              max="1.55" step="0.01"><output></output></div>
          <div class="fx-slider"><label>桌面歌词透明</label><input id="fx-desktoplyricsopacity" type="range" min="0.28"
              max="1" step="0.01"><output></output></div>
          <div class="fx-slider"><label>桌面歌词高度</label><input id="fx-desktoplyricsy" type="range" min="0.08" max="0.92"
              step="0.01"><output></output></div>
          <div class="fx-section-label">桌面帧数</div>
          <div class="fx-seg" id="desktop-lyrics-fps-seg">
            <button data-desktop-lyrics-fps="24">24</button>
            <button data-desktop-lyrics-fps="30">30</button>
            <button data-desktop-lyrics-fps="60">60</button>
            <button data-desktop-lyrics-fps="120">120</button>
            <button data-desktop-lyrics-fps="0">无上限</button>
          </div>
          <div class="desktop-mode-note">开启后可在右上控制器显示或隐藏 Windows 桌面图标；按 Esc 直接退出。重启默认关闭。</div>
          <div class="fx-section-label" hidden>壁纸帧数</div>
          <div class="fx-seg" id="wallpaper-fps-seg" hidden>
            <button data-wallpaper-fps="24">24</button>
            <button data-wallpaper-fps="30">30</button>
            <button data-wallpaper-fps="60">60</button>
          </div>
          <div class="fx-slider" hidden><label>壁纸透明度</label><input id="fx-wallpaperopacity" type="range" min="0.35"
              max="1" step="0.01"><output></output></div>
        </div>
      </div>
