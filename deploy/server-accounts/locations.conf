location = /mineradio-accounts {
    return 308 https://music.hbsuzh.cn/mineradio-accounts/;
}

location ^~ /mineradio-accounts/ {
    proxy_pass http://127.0.0.1:18883;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 64k;
    proxy_read_timeout 18s;
}

location = /api/server-account/v1/credentials {
    proxy_pass http://127.0.0.1:18883;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 10s;
}

location ^~ /api/server-account/v1/ { return 404; }
